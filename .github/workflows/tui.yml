name: Terminal

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "examples/terminal-workbench/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "crates/**"
      - "examples/terminal-workbench/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # QuickJS and its generated bindings need a C compiler and libclang.
      # The terminal crates build independently of the GUI toolkits.
      - name: Install clang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Configure Windows clang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tui-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-tui-
      - name: Clippy
        run: cargo clippy --locked --all-targets -p nsh-platform-tui -p nsh-tui-host -p nsh-tui-app -- -D warnings
      - name: Test
        run: cargo test --locked -p nsh-platform-tui -p nsh-tui-host -p nsh-tui-app
      - name: Check the Rust runtime
        run: cargo check --locked -p nsh-platform-tui --no-default-features
      - name: Build the operations workbench
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p nsh-cli -p nsh-tui-host
          ./target/debug/nsh build examples/terminal-workbench -o target/terminal-workbench
      - name: Exercise Unicode, filters, deployment and resize
        if: runner.os == 'Linux'
        run: |
          ./target/debug/nsh-tui-host --bundle target/terminal-workbench/bundle.nshc --size 160x50 \
            --script "wait 300; expect Operations workbench; expect-focus; shot target/terminal-workbench-home.txt; type 王宁; expect 12 services; key Ctrl+a; type gateway; expect 2 services; key Tab; key Tab; key Tab; key Enter; expect No matching services; key Shift+Tab; key Shift+Tab; key Enter; expect 2 services; tap 40 13; expect Selected: edge-gateway; tap 148 1; expect Deploy service; key Ctrl+a; type Canary · 安全发布 👩‍💻; key Tab; key Tab; key Enter; expect Deployment queued; expect v2.19.0; shot target/terminal-workbench-deployed.txt; tap 8 9; expect Active incidents; tap 8 11; expect Release history; resize 120 34; expect Release history; expect Traffic overview; resize 100 30; expect Release history; expect-focus; shot target/terminal-workbench-compact.txt; quit"
      - name: Upload terminal snapshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-snapshots
          path: target/terminal-*.txt
          if-no-files-found: ignore
