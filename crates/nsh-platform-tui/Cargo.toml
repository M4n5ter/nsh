[package]
name = "nsh-platform-tui"
description = "Terminal backend for Native Shell: embeddable Ratatui surfaces, input and native runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
js = ["nsh-engine/js"]
dev = ["js", "dep:nsh-dev"]

[dependencies]
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-base.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
ratatui.workspace = true
ratatui-image.workspace = true
crossterm.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
unicode-linebreak.workspace = true
unicode-bidi.workspace = true
tiny-skia.workspace = true
fontdb.workspace = true
rustybuzz.workspace = true
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
ttf-parser.workspace = true
ureq.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
serde_json.workspace = true
url.workspace = true
base64.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation"] }
